apiVersion: apps/v1
kind: Deployment
metadata:
  name: pep-index
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pep-index
  template:
    metadata:
      labels:
        app: pep-index
    spec:
      containers:
        - name: pep-index
          image: opentrade/pep-index:latest
          ports:
            - containerPort: 8001
          env:
            - name: PEP_INDEX_INDEX_URL
              value: "https://api.opentradeprotocol.com/v1"
            - name: PEP_INDEX_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pep-index-secrets
                  key: database-url
            - name: PEP_INDEX_MEILISEARCH_URL
              value: "http://meilisearch:7700"
            - name: PEP_INDEX_QDRANT_URL
              value: "http://qdrant:6333"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pep-index
spec:
  selector:
    app: pep-index
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
